<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title></title>
	<link rel="stylesheet" href="css/index.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>


<body>
	<div id="user">
		<label for="modelInput">模型类型</label>
		<input type="text" id="modelInput" value="deepseek-flash" placeholder="例如 deepseek-chat" />
		<textarea name="" id="" cols="30" rows="10"></textarea>
		<button id="submitButton" onclick="submit()">提交</button>
		<button onclick="save()">保存文件</button>
		<p id="okane">预计花费 0.00 元</p>
		<div id="waitStats" aria-live="polite">
			<div id="waitTimer">本次已等待 0 秒</div>
			<div id="waitHistory">历史首个有效文本：暂无数据</div>
		</div>
		<p id="requestStatus" role="status" aria-live="polite">等待提交</p>
		<p id="content"></p>
		<label for="personNames">人物名称（逗号分隔）</label>
		<input type="text" id="personNames" placeholder="例如：张三,李四,王五" />
		<label for="dialogueFont">对话字体</label>
		<input type="text" id="dialogueFont" placeholder="例如：宋体、Microsoft YaHei" />

	</div>
	<div id="presets">
		<p>添加到解密区预设</p>
	</div>
	<div id="consets">
		<p>处理到输入追加预设</p>
	</div>
	<div id="secret">
		<textarea name="" id="" cols="30" rows="10"></textarea>
		<input type="text" placeholder="key" />
		<button onclick="jia()">加密</button>
		<button onclick="jie()">解密</button>
	</div>
	<button onclick="showInputDialog()">修改秘钥</button>

</body>
<script src="js/verify.js"></script>
<script src="js/deepseek.js"></script>
<script src="js/secret.js"></script>
<script src="js/mainpage.js"></script>
<script src="js/preset.js"></script>
<script src="js/save.js"></script>

</html>
